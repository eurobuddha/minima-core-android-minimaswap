plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.eurobuddha.minimaswap'
    compileSdk 36

    defaultConfig {
        applicationId "com.eurobuddha.minimaswap"
        minSdk 28
        targetSdk 35
        versionCode 1802
        versionName "0.18.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        // Minima family release key. Credentials come from ~/.gradle/gradle.properties
        // (outside every repo), so nothing secret is ever committed. On a machine without
        // those props this config stays empty and release falls back to debug signing.
        release {
            def ksFile = project.findProperty('MINIMA_FAMILY_RELEASE_STORE_FILE')
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword project.findProperty('MINIMA_FAMILY_RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('MINIMA_FAMILY_RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('MINIMA_FAMILY_RELEASE_KEY_PASSWORD')
            }
        }
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign release with the debug keystore, matching the minima-core-android node app.
            // IPC is authorized by the MINIMA_ID token, not by signature, so this is sufficient
            // for sideloading. Swap to a dedicated release keystore if uploading to Play.
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig true
    }
    testOptions {
        // Local JVM unit tests (src/test) exercise the fund-critical pure logic ported from usdtSwap:
        // timelock ordering (F2) and the ETH-leg encoding. A REAL org.json goes on the test classpath (see
        // testImplementation below) so parsing runs against the genuine library, so we do NOT enable
        // returnDefaultValues.
        unitTests {
            returnDefaultValues = false
            includeAndroidResources = false
        }
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Message + contact lists
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Background swap watcher: WorkManager re-launches the foreground service if the OS kills it.
    implementation 'androidx.work:work-runtime:2.9.1'

    // Minima Core IPC client SDK (the only way this app reaches the node)
    implementation files('libs/minimaapi.aar')

    // Client-side end-to-end crypto: X25519 sealed box + Ed25519 (libsodium via Lazysodium).
    // The minimaCore node has no Maxima, so all encryption/signing happens in-app; the node
    // only carries the sealed blob in coin state. Keys are derived from the Minima seed.
    implementation 'com.goterl:lazysodium-android:5.1.0@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'

    // QR: generate your key as a QR (core) + scan a contact's key (embedded scanner).
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Ethereum: key derivation (secp256k1), legacy tx signing (RLP) and ABI encode/decode.
    // We do the JSON-RPC ourselves over HttpURLConnection, so we pull only the pure-Java web3j
    // modules (no okhttp/core HTTP stack) to stay light on Android. Bouncy Castle comes transitively.
    implementation 'org.web3j:crypto:4.9.8'
    implementation 'org.web3j:abi:4.9.8'
    implementation 'org.web3j:rlp:4.9.8'
    implementation 'org.web3j:utils:4.9.8'

    // ---- Local JVM unit tests (src/test) ----
    // JUnit 4 runner + a REAL org.json (Android's bundled one is stubbed to throw in unit tests). Mockito is
    // available for any test that needs to double the Android-coupled NodeApi. Ported from usdtSwap alongside
    // the fund-safety fixes.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.mockito:mockito-core:5.12.0'
}
